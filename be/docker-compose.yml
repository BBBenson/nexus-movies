version: '3.8'
services:
  web:
    build: ./nexus_movies_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./nexus_movies_backend:/  :/usr/src/nexus_movies_backend/
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev

  # Uncomment the following lines to add a PostgreSQL database service
  #   depends_on:
  #     - db
  #   environment:
  #     DATABASE_URL: postgres://myuser:mypassword@db:5432/mydatabase
  # db:
  #   image: postgres:13
  #   environment:
  #     POSTGRES_DB: mydatabase
  #     POSTGRES_USER: myuser
  